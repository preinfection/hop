<!doctype html>
<!-- A Hop Island extension: any page in its own folder with a manifest.json.
     It runs in a sandboxed frame on the island (no access to your files);
     postMessage({hop: "popup", title, text}, "*") asks for a pop-up. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font: 600 13px/1.3 "Segoe UI Variable Text", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: space-around; padding: 0 26px 0 18px; box-sizing: border-box; }
  .c { text-align: center; }
  .t { font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .n { color: rgba(235,235,245,.6); font-weight: 500; font-size: 11.5px; margin-top: 2px; }
  .d { color: #ffd479; font-size: 10.5px; font-weight: 500; }
</style>
</head>
<body>
<script>
  const CITIES = [["Toronto", "America/Toronto"], ["London", "Europe/London"], ["Makkah", "Asia/Riyadh"]];
  const here = new Date().getDate();
  function draw() {
    const now = new Date();
    document.body.innerHTML = CITIES.map(([name, tz]) => {
      const t = now.toLocaleTimeString([], { timeZone: tz, hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/i, "");
      const day = +now.toLocaleDateString("en-CA", { timeZone: tz, day: "numeric" });
      return `<div class="c"><div class="t">${t}</div><div class="n">${name}</div><div class="d">${day !== here ? (day > here || day === 1 ? "tomorrow" : "yesterday") : "&nbsp;"}</div></div>`;
    }).join("");
  }
  draw();
  setInterval(draw, 15000);
</script>
</body>
</html>
