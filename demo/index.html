<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hop 0.1.3 demo</title>
<style>
  :root { --bg: #0b0b0d; --panel: #141417; --row: #1d1d22; --line: rgba(255,255,255,.08); --text: #f2f2f5; --dim: rgba(235,235,245,.6); --blue: #0a84ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
  .desk { position: relative; overflow: hidden;
    background: radial-gradient(90% 70% at 30% 20%, #3b2a6b 0%, transparent 60%), radial-gradient(80% 70% at 80% 80%, #0f5f6b 0%, transparent 60%), linear-gradient(160deg, #141826, #0b0d14); }
  .desk::after { content: "Hover the island · scroll it for pages · drag a card up to swipe it away"; position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: rgba(255,255,255,.45); font-size: 13px; }
  #islandFrame { position: absolute; left: 50%; top: 0; border: 0; background: transparent; color-scheme: normal; }
  .side { border-left: 1px solid var(--line); padding: 16px 16px 30px; overflow-y: auto; background: var(--panel); }
  h1 { font-size: 17px; margin: 0 0 2px; } h1 span { color: var(--dim); font-weight: 400; font-size: 13px; }
  .lead { color: var(--dim); font-size: 12.5px; margin: 0 0 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 16px 0 7px; font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 0; background: var(--row); color: var(--text); padding: 7px 11px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { background: #2a2a31; }
  button.primary { background: var(--blue); color: #fff; }
  #log { margin-top: 14px; font: 11.5px/1.45 Consolas, monospace; color: var(--dim); white-space: pre-wrap; min-height: 60px; background: #0e0e11; border-radius: 8px; padding: 8px; }
  .settings { position: fixed; inset: 28px 28px 28px 28px; z-index: 5; display: none; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: #0b0b0d; }
  .settings-open .settings { display: block; }
  .settings iframe { width: 100%; height: calc(100% - 38px); border: 0; display: block; }
  .settings .bar { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; background: #1b1b1f; font-size: 13px; color: var(--dim); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 4; }
  .settings-open .scrim { display: block; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 420px auto; overflow: auto; } .side { border-left: 0; } }
</style>
</head>
<body>
<div class="desk"><iframe id="islandFrame" title="Hop Island"></iframe></div>
<aside class="side">
  <h1>Hop 0.1.3 <span>· browser demo</span></h1>
  <p class="lead">The real island and settings pages, with a pretend PC behind them. Nothing here touches your installed Hop.</p>
  <div class="btns"><button class="primary" onclick="__demoHost.openSettings()">Open settings</button><button onclick="__demoHost.demo.pin()">Keep it open</button></div>

  <h2>Music</h2>
  <div class="btns"><button onclick="__demoHost.demo.togglePlay()">Play / pause</button><button onclick="__demoHost.demo.nextSong()">Next song</button><button onclick="__demoHost.demo.nothing()">Nothing playing</button></div>

  <h2>AI agents</h2>
  <div class="btns"><button onclick="__demoHost.demo.agentAsk()">Permission request</button><button onclick="__demoHost.demo.agentQuestion()">Question</button>
    <button onclick="__demoHost.demo.agentPlan()">Plan review</button><button onclick="__demoHost.demo.agentEdit()">Live edit</button><button onclick="__demoHost.demo.agentDone()">Done</button></div>

  <h2>Pop-ups</h2>
  <div class="btns"><button onclick="__demoHost.demo.notif()">Discord message</button><button onclick="__demoHost.demo.mail()">Email</button>
    <button onclick="__demoHost.demo.calendar()">Meeting in 1 min</button><button onclick="__demoHost.demo.download()">Download done</button>
    <button onclick="__demoHost.demo.snip()">Screenshot</button><button onclick="__demoHost.demo.rain()">Rain alert</button>
    <button onclick="__demoHost.demo.reminder()">Reminder</button><button onclick="__demoHost.demo.goal()">Goal scored</button>
    <button onclick="__demoHost.demo.update()">Update ready</button><button onclick="__demoHost.demo.drop()">File dropped</button></div>

  <h2>Clipper</h2>
  <div class="btns"><button onclick="__demoHost.demo.clip()">Clip saved (Trim / Upload)</button><button onclick="__demoHost.demo.rec()">Start / stop recording</button></div>

  <h2>On the pill</h2>
  <div class="btns"><button onclick="__demoHost.demo.timer10()">10 s timer</button><button onclick="__demoHost.demo.caps()">Caps Lock</button><button onclick="__demoHost.demo.wifi()">Wi-Fi</button>
    <button onclick="__demoHost.demo.focus()">Focus on / off</button><button onclick="__demoHost.demo.mic()">Mic in use</button><button onclick="__demoHost.demo.cam()">Camera in use</button>
    <button onclick="__demoHost.demo.bt()">Earbuds</button><button onclick="__demoHost.demo.charge()">Charging</button><button onclick="__demoHost.demo.low()">Low battery</button>
    <button onclick="__demoHost.demo.prayer()">Prayer in 1 min</button><button onclick="__demoHost.demo.game()">Game mode on / off</button></div>
  <div id="log"></div>
</aside>
<div class="scrim" onclick="__demoHost.closeSettings()"></div>
<div class="settings"><div class="bar"><span>Hop settings (the real settings app)</span><button onclick="__demoHost.closeSettings()">Close</button></div><iframe id="settingsFrame" title="Hop settings"></iframe></div>
<script src="/demo/host.js"></script>
<script>__demoHost.ready.then(() => { document.getElementById("islandFrame").src = "/island/ui/index.html"; });</script>
</body>
</html>
